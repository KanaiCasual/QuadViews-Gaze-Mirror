# Eye gaze indicator drawn on the OBS mirror only (never visible in the headset).
# Requires the Quad-Views-Foveated build that exports the eye gaze.
# The game reads this file when it starts and never polls it while running. To change things
# live, use the OpenXR Gaze Overlay settings app (hand edits go live while that app is open).
enabled=1

# Look of the indicator:
#   ghost     = Tobii Ghost look: thin neon ring with a clear center and a glowing
#               teardrop tail that stretches when the eyes move
# Blobs with a fading trail:
#   bubble    = soft blob with a faint center and a brighter rim
#   solid     = evenly filled soft blob
#   heatmap   = dwell-time colors: blue (glance) -> green -> yellow -> red (stare)
# Simple shapes (no trail):
#   ring      = thin circle (optionally with a faint fill and a dark outline)
#   glow      = soft borderless highlight, no hard edges
#   dot       = small soft dot
#   spotlight = leaves the gaze area untouched and gently darkens everything else
style=ghost
# screen = blends like light, the scene stays visible through it (recommended).
# normal = blends like paint, more visible but covers what is behind it.
blend=screen
# screen only: 0 = pure light (can vanish on bright sky) ... 1 = nearly as solid as normal.
solidity=0.4

# Sizes are fractions of the (uncropped) mirror image height.
# thickness = how wide the ring line looks. feather = how soft its edges are: the fade
# happens within the line, so it never makes the line wider (0 = hard edge, equal to
# thickness = fully soft). For bubble/solid/dot, feather is the blob's edge softness (~0.01).
radius=0.042
thickness=0.0010
feather=0.0010

# Color (R,G,B 0-255) and opacity (0-1). Heatmap uses its own colors. For spotlight,
# opacity is how much the surroundings are darkened.
color=40,170,245
opacity=0.5
# Opacity inside the ring (ghost/ring) or at the center of the blob (bubble). 0 = clear.
fill_opacity=0

# ghost: reach of the neon glow around the ring and tail.
glow=0.0028
# ghost: brightness of that glow relative to the ring line (0 = no glow).
glow_strength=0.4
# ghost: opacity of the tail relative to the ring, and its maximum length.
tail_opacity=0.7
tail_max=0.2
# ghost: how long the tail lags behind the ring (longer = longer, lazier tail).
trail_ms=200
# bubble/solid: length of the fading trail behind the blob.
blob_trail_ms=450
# heatmap: how long you have to stare for a spot to go from blue to red, and how long a spot
# stays where it was, cooling down, after you look away.
heat_ms=2000
heat_cool_ms=700
# world  = the tail follows where the gaze was in the world, so head turns stretch it too (VR).
# screen = the tail only follows on-screen motion (like a desktop eye tracker).
tail_space=world
# ring/dot only: soft dark outline so a faint indicator stays visible over bright backgrounds (0 = none).
shadow_opacity=0.3

# Responsiveness: position smoothing time constant in milliseconds (0 = raw, jittery).
smoothing_ms=60
# Keep showing the last position for this long after the eye tracking drops out (rides through blinks).
hold_ms=300
# Fade in/out duration when the indicator appears/disappears.
fade_ms=150
# Treat the gaze as lost when no fresh sample was received for this long.
timeout_ms=250
# 1 = ignore the horizontal/vertical focus offsets configured in Quad-Views-Foveated.
use_raw_gaze=0

# Where the ring lands. The gaze starts between the eyes, but the mirror shows one eye
# sitting half an IPD to the side, so the right spot depends on how far away the thing
# you look at is.
#   layer    = project the gaze into the mirrored eye here, for focus_distance (exact
#              per eye, follows the eye selected in OBS)
#   producer = use Quad-Views-Foveated's own projection (assumes roughly 1 m)
projection=layer
# Distance in meters to what you usually look at. 0 = far away (outside the cockpit,
# HUD symbology). Use about 0.7 if cockpit switches matter more than the outside.
focus_distance=0
# Manual trim on top, in fractions of the image height (+X right, +Y up).
offset_x=0
offset_y=0

# Smoothing of the ring position.
#   adaptive = steady while the eye is still, instant when it jumps (recommended)
#   simple   = fixed smoothing, see smoothing_ms
filter=adaptive
# adaptive: lower = steadier but laggier ring during fixations (Hz).
filter_min_cutoff=1.5
# adaptive: higher = the smoothing lets go sooner as the eye speeds up.
filter_beta=8

# Dwell feedback: hold the gaze on one spot this long (ms) and the ring tightens and
# brightens a little, so viewers can tell reading from glancing. 0 = off.
dwell_ms=500
# How much the ring tightens while dwelling (fraction of its radius).
dwell_shrink=0.25
